basePath: /
host: www.alive.org.tw
info:
  contact:
    email: rayselfs@alive.org.tw
    name: API Support
    url: https://github.com/your-repo
  description: This is a sample server for a Bible API system, powered by Gin and
    GORM.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Bible System API
  version: "1.0"
paths:
  /ready:
    get:
      description: Checks local Dapr outbound health only, without acquiring a database connection.
      produces: [application/json]
      tags: [Operations]
      summary: Dapr outbound readiness
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties:
              type: string
        "503":
          description: Service Unavailable
          schema:
            type: object
            additionalProperties:
              type: string
schemes:
- https
swagger: "2.0"
