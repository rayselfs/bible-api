openapi: 3.1.0
x-hhc-service: bible-api
x-hhc-owner: HHC Platform
x-hhc-repository: rayselfs/bible-api
info:
  title: Bible API
  version: 1.0.0
  description: Service-owned contract for the Bible API. The legacy Swagger 2.0 document remains available at /swagger/* and is not this catalog source.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Service root
security: []
tags:
  - name: Operations
    description: Service operational endpoints.
  - name: Public
    description: Gateway-exposed browser operations.
  - name: Private
    description: Service operations not exposed by the API gateway.
paths:
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Service health
      x-hhc-visibility: operations
      x-hhc-callers: []
      responses:
        '200':
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/bible/v1/versions:
    get:
      tags: [Public]
      operationId: getVersionsV1
      summary: List Bible versions
      description: Gateway-exposed public operation. The public API gateway clears identity headers, so gateway reads return only public Bible versions. Direct and internal callers can supply unverified identity headers because middleware only copies them.
      x-hhc-visibility: public
      x-hhc-callers: [hhc-client]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
      responses:
        '200':
          description: Available Bible versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Version'
        '500':
          $ref: '#/components/responses/RetrieveVersionsError'
  /api/bible/v1/content/{version_id}:
    get:
      tags: [Public]
      operationId: getVersionContent
      summary: Stream complete Bible content
      description: Gateway-exposed public operation. The public API gateway clears identity headers, so gateway reads can stream only public Bible versions. The handler writes a start event before store and access failures; error and timeout event data therefore use the already-started 200 response. Direct and internal callers can supply unverified identity headers because middleware only copies them.
      x-hhc-visibility: public
      x-hhc-callers: [hhc-client, hhc-client-v2]
      x-hhc-sse-events:
        - name: start
          fields: [type, message]
        - name: header
          fields: [version_id, version_code, version_name, updated_at, books]
        - name: book
          fields: [id, number, name, abbreviation, chapters]
        - name: complete
          fields: [type, total_books, message]
        - name: error
          fields: [type, message]
        - name: timeout
          fields: [type, message]
      parameters:
        - $ref: '#/components/parameters/VersionID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
      responses:
        '200':
          description: Server-Sent Events containing Bible content.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidVersionID'
        '500':
          description: The response writer does not support flushing. The handler has already set text/event-stream, so its JSON error bytes retain that media type.
          content:
            text/event-stream:
              schema:
                type: string
  /api/bible/v1/vectors/{version_id}:
    get:
      tags: [Public]
      operationId: getVersionVectors
      summary: Stream Bible vectors
      description: Gateway-exposed public operation. The public API gateway clears identity headers, so gateway reads can stream only public Bible versions. The binary stream contains repeated little-endian records of one uint32 verse ID followed by 384 float32 values. A store, access, write, or timeout failure terminates the already-started 200 stream without a terminal record. Direct and internal callers can supply unverified identity headers because middleware only copies them.
      x-hhc-visibility: public
      x-hhc-callers: []
      parameters:
        - $ref: '#/components/parameters/VersionID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
      responses:
        '200':
          description: Binary vector stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/InvalidVersionID'
        '500':
          description: The response writer does not support flushing. The handler has already set application/octet-stream, so its JSON error bytes retain that media type.
          content:
            application/octet-stream:
              schema:
                type: string
  /api/bible/v1/verse/{id}:
    post:
      tags: [Private]
      operationId: updateVerse
      summary: Update verse text
      description: Private operation; it is not exposed by the API gateway. The handler accepts an unverified X-Permissions value containing bible:edit or bible:admin. Middleware only copies identity headers and does not authenticate or authorize a caller.
      x-hhc-visibility: private
      x-hhc-callers: []
      parameters:
        - $ref: '#/components/parameters/VerseID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVerseRequest'
      responses:
        '200':
          description: Verse updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateVerseResponse'
        '400':
          description: Invalid verse ID or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing, malformed, or insufficient propagated permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Verse text could not be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/bible/v2/versions:
    get:
      tags: [Public]
      operationId: getVersionsV2
      summary: List Bible versions with locales
      description: Gateway-exposed public operation. The public API gateway clears identity headers, so gateway reads return only public Bible versions. Direct and internal callers can supply unverified identity headers because middleware only copies them.
      x-hhc-visibility: public
      x-hhc-callers: [hhc-client-v2]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Roles'
        - $ref: '#/components/parameters/Permissions'
      responses:
        '200':
          description: Available Bible versions with locale.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionV2'
        '500':
          $ref: '#/components/responses/RetrieveVersionsError'
components:
  parameters:
    UserID:
      name: X-User-ID
      in: header
      required: false
      description: The public API gateway clears this header. Direct and internal callers can provide an unverified value; middleware copies it without authentication or authorization.
      schema:
        type: string
    Roles:
      name: X-Roles
      in: header
      required: false
      description: The public API gateway clears this header. Direct and internal callers can provide an unverified value; middleware copies it without authentication or authorization.
      schema:
        type: string
    VersionID:
      name: version_id
      in: path
      required: true
      schema:
        type: integer
    VerseID:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Permissions:
      name: X-Permissions
      in: header
      required: false
      description: The public API gateway clears this header. Direct and internal callers can provide an unverified value; middleware copies it without authentication or authorization. For a direct/internal read, bible:read changes version filtering; for the private write, bible:edit or bible:admin enables the handler.
      schema:
        type: string
  responses:
    InvalidVersionID:
      description: Version ID is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RetrieveVersionsError:
      description: Versions could not be retrieved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Version:
      type: object
      required: [id, code, name, updated_at]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        updated_at:
          type: integer
          format: int64
    VersionV2:
      type: object
      required: [id, code, name, locale, updated_at]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        locale:
          type: string
        updated_at:
          type: integer
          format: int64
    UpdateVerseRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
    UpdateVerseResponse:
      type: object
      required: [message, id]
      properties:
        message:
          type: string
        id:
          type: integer
          format: int64
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
