name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bible-api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_PASSWORD: bible-test
          POSTGRES_DB: bible_pool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d bible_pool_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BIBLE_TEST_DATABASE_URL: postgres://postgres:bible-test@127.0.0.1:5432/bible_pool_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.x
      - name: Verify
        run: |
          npx --yes @redocly/cli@2.47.0 lint docs/openapi.yaml
          test -n "$BIBLE_TEST_DATABASE_URL"
          go test -race ./... -count=1 -p=1
          go vet ./...
          python3 -m unittest discover -s scripts/aca-readiness-isolation -p 'test_*.py'
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/readiness-aca-isolation.yml
          ./scripts/test-release-workflow.sh
          ./scripts/test-readiness-isolation.sh
          docker build -t bible-api:verify .
          docker build -f scripts/aca-readiness-isolation/Dockerfile -t bible-readiness-fixture:verify .
