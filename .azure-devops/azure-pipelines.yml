trigger:
  tags:
    include:
      - "*"

pool:
  vmImage: "ubuntu-latest"

variables:
  registry: "alive.azurecr.io"
  repository: "alive/bible-api"
  containerAppName: "bible-api"
  resourceGroup: "alive"

steps:
  - checkout: self
    fetchDepth: 0

  - task: NodeTool@0
    inputs:
      versionSpec: "24.x"
    displayName: "Use Node.js 24"

  - script: npx --yes @redocly/cli@2.47.0 lint docs/openapi.yaml
    displayName: "Validate OpenAPI contract"

  - script: |
      # Get the latest tag from git repository
      LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

      if [ -z "$LATEST_TAG" ]; then
        echo "No tags found, using commit SHA as image tag"
        IMAGE_TAG="$(git rev-parse --short HEAD)"
      else
        echo "Latest Git Tag: $LATEST_TAG"
        IMAGE_TAG="$LATEST_TAG"
      fi

      echo "Image Tag: $IMAGE_TAG"
      echo "##vso[task.setvariable variable=IMAGE_TAG]$IMAGE_TAG"
    displayName: "Get Latest Git Tag"

  # Build Main API
  - task: Docker@2
    displayName: "Build API Docker Image"
    inputs:
      command: "build"
      repository: "$(registry)/$(repository)"
      Dockerfile: "Dockerfile"
      buildContext: "$(System.DefaultWorkingDirectory)"
      tags: "$(IMAGE_TAG)"

  # Push Main API
  - task: Docker@2
    displayName: "Push API Docker Image"
    inputs:
      command: "push"
      containerRegistry: "alive-acr"
      repository: "$(repository)"
      tags: "$(IMAGE_TAG)"
